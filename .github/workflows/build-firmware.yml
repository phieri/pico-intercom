name: Build Raspberry Pi Pico W Firmware

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

env:
  PICO_SDK_VERSION: 2.3.0

jobs:
  build-firmware:
    name: Build Firmware (${{ matrix.board }})
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        board: [pico_w, pico2_w]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install dependencies
      run: |
        sudo apt-get -qq update
        sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential

    - name: Cache Pico SDK
      id: cache-pico-sdk
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}/pico-sdk
        key: pico-sdk-${{ env.PICO_SDK_VERSION }}

    - name: Checkout Pico SDK
      if: steps.cache-pico-sdk.outputs.cache-hit != 'true'
      uses: actions/checkout@v7
      with:
        repository: raspberrypi/pico-sdk
        ref: ${{ env.PICO_SDK_VERSION }}
        path: pico-sdk
        submodules: recursive

    - name: Set Pico SDK path
      run: echo "PICO_SDK_PATH=${{ github.workspace }}/pico-sdk" >> $GITHUB_ENV

    - name: Create build directory
      run: mkdir -p build

    - name: Configure CMake
      working-directory: build
      run: cmake .. -DCMAKE_BUILD_TYPE=Release -DPICO_BOARD=${{ matrix.board }}

    - name: Build firmware
      working-directory: build
      run: make -j$(nproc)

    - name: List build artifacts
      working-directory: build
      run: |
        echo "Build artifacts:"
        ls -lh *.uf2 *.elf *.bin 2>/dev/null || echo "No artifacts found"

    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v7
      with:
        name: pico-intercom-firmware-${{ matrix.board }}
        path: |
          build/*.uf2
          build/*.elf
          build/*.bin
          build/*.hex
        if-no-files-found: warn
